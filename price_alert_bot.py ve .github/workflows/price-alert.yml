name: Price Alert Bot

on:
  schedule:
    - cron: "*/5 * * * *"      # a new run is queued every 5 min; each run listens for ~9 min
  workflow_dispatch:

concurrency:
  group: price-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Alerts/users are kept in a private cache, NOT committed to the (public) repo.
      - name: Restore data
        uses: actions/cache/restore@v4
        with:
          path: alerts.json
          key: alerts-${{ github.run_id }}
          restore-keys: alerts-

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          OWNER_CHAT_ID: ${{ vars.OWNER_CHAT_ID }}
          ALLOWED_CHAT_IDS: ${{ vars.ALLOWED_CHAT_IDS }}
          BOT_TITLE: ${{ vars.BOT_TITLE }}
          POPULAR: ${{ vars.POPULAR }}
          SUMMARY_ASSETS: ${{ vars.SUMMARY_ASSETS }}
          SUMMARY_TIME: ${{ vars.SUMMARY_TIME }}
          LOCAL_TZ: ${{ vars.LOCAL_TZ }}
          RUN_MODE: loop
          MAX_RUNTIME: "540"
        run: python price_alert_bot.py

      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alerts.json
          key: alerts-${{ github.run_id }}
