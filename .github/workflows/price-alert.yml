name: Price Alert Bot

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 min (GitHub may delay runs a few minutes)
  workflow_dispatch:

concurrency:
  group: price-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Alerts are kept in a private cache, NOT committed to the (public) repo,
      # so users' chat ids never become public.
      - name: Restore alerts
        uses: actions/cache/restore@v4
        with:
          path: alerts.json
          key: alerts-${{ github.run_id }}
          restore-keys: alerts-

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ vars.ALLOWED_CHAT_IDS }}
          RUN_MODE: once
        run: python price_alert_bot.py

      - name: Save alerts
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alerts.json
          key: alerts-${{ github.run_id }}
